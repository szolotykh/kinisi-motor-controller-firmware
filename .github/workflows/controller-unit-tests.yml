name: Firmware pre-merge tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Controller unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install PlatformIO
        run: |
          python3 -m venv "$RUNNER_TEMP/pio"
          "$RUNNER_TEMP/pio/bin/pip" install platformio==6.1.18
          echo "$RUNNER_TEMP/pio/bin" >> "$GITHUB_PATH"

      - name: Run native Unity suites
        run: |
          pio test -e test_native -e test_platforms --junit-output-path "$RUNNER_TEMP/unity.xml"
          python3 - "$RUNNER_TEMP/unity.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          expected = {
              "test_native:test_utils", "test_native:test_commands", "test_native:test_controller",
              "test_platforms:test_platform_differential", "test_platforms:test_platform_mecanum",
              "test_platforms:test_platform_odometry", "test_platforms:test_platform_omni",
          }
          exercised = {
              suite.get("name") for suite in ElementTree.parse(sys.argv[1]).findall("testsuite")
              if suite.find("testcase[@status='PASSED']") is not None
          }
          missing = expected - exercised
          if missing:
              sys.exit("No passing Unity test cases in: " + ", ".join(sorted(missing)))
          PY

      - name: Install STM32Cube headers for the register-model suite
        if: ${{ hashFiles('test/test_encoder_hardware/run_tests.py') != '' }}
        run: pio pkg install --global --tool platformio/framework-stm32cubef4@1.28.1

      - name: Run all native firmware suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(test/test_*/run_tests.py)
          if (( ${#suites[@]} == 0 )); then
            echo "::error::No native firmware test suites were found"
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            python3 "$suite"
            echo "::endgroup::"
          done
