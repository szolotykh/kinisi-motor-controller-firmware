; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F405RG]
extra_scripts =
  pre:tools/board_config_generator/platformio_build.py
  pre:tools/build_identity.py
platform = ststm32
board = genericSTM32F405RG
framework = stm32cube
debug_tool = stlink
upload_protocol = stlink
; Pin OpenOCD to a version whose ST-Link config still uses `hla_swd`.
; The newer tool-openocd 3.1200.x uses `interface/stlink.cfg` with plain SWD and
; breaks the ststm32 platform's default upload script ("Debug adapter doesn't
; support 'hla_swd' transport").
platform_packages =
  platformio/tool-openocd@~2.1100.0
lib_archive = false
test_ignore = test_desktop, test_platform
; Need this to change HCE value in stm32f4xx_hal_config.h
board_build.stm32cube.custom_config_header = yes
build_flags =
  -mfloat-abi=softfp
  -Iinclude
  -mfpu=fpv4-sp-d16 ;Enable floating point extension

[env:test_native]
platform = native
test_build_src = no
build_flags = 
    -D UNITY_INCLUDE_DOUBLE 
    -DUNITY_DOUBLE_PRECISION=1e-12 
    -Iinclude 
    -Ilib/FreeRTOS/src 
    -Ilib/hardware 
    -Ilib/libcontrollers/src
lib_deps =
    FreeRTOS
    cmsis
    stm32cube
test_framework = unity
lib_ignore = FreeRTOS, hardware
test_filter = test_utils, test_commands, test_controller

[env:test_platforms]
platform = native
test_build_src = yes
build_flags = 
    -D UNITY_INCLUDE_DOUBLE 
    -DUNITY_DOUBLE_PRECISION=1e-12 
    -Iinclude 
    -Ilib/FreeRTOS/src 
    -Ilib/hardware 
    -Ilib/libcontrollers/src
lib_deps =
    FreeRTOS
    cmsis
    stm32cube
test_framework = unity
lib_ignore = FreeRTOS, hardware
; Include the production integrator exercised by the platform odometry pipeline.
build_src_filter = +<platform_omni.c> +<platform_mecanum.c> +<platform_differential.c> +<odometry_integrator.c>
test_filter = test_platform_*

; Explicit board targets. The original generic target remains v0.3.
[env:v0_1]
extends = env:genericSTM32F405RG
build_flags =
  ${env:genericSTM32F405RG.build_flags}
  -DMP_V1

[env:v0_2]
extends = env:genericSTM32F405RG
build_flags =
  ${env:genericSTM32F405RG.build_flags}
  -DMP_V2

[env:v0_3]
extends = env:genericSTM32F405RG
build_flags =
  ${env:genericSTM32F405RG.build_flags}
  -DMP_V3

; Board v0.4: STM32F405VGT6, enable/direction motor drivers.
[env:v0_4]
extends = env:genericSTM32F405RG
board_build.mcu = stm32f405vgt6
board_upload.maximum_size = 1048576
build_flags =
  ${env:genericSTM32F405RG.build_flags}
  -DMP_V4
